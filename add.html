<!DOCTYPE html>
<!--
  https://risers.fit/add?code=XXXXX

  The address the Risers QR code and older invite links point at. With the
  app installed, iOS and Android open it directly and this page never loads.

  Without the app, this page used to be the invite page itself. That job has
  moved to https://join.risers.fit, which shows the store buttons for the
  phone in hand and hands the code on. So this page now only FORWARDS there,
  carrying the code along as `?c=`. Keeping it (rather than deleting it)
  rescues every old link and printed QR code already out in the world.

  The path must stay `/add`: the app's link association
  (.well-known/apple-app-site-association) claims it.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join me on Risers</title>
  <meta name="robots" content="noindex" />

  <!-- What an old link unfurls into in Messages and WhatsApp. Message apps
       read these from this page and do not follow the forward below. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Risers" />
  <meta property="og:title" content="Join me on Risers" />
  <meta property="og:description" content="A private space for a partner or your closest few." />
  <meta property="og:image" content="https://join.risers.fit/og/risers.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    // First thing on the page, so nothing is drawn before the forward.
    (function () {
      var code = new URLSearchParams(location.search).get('code') || '';
      code = code.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
      location.replace('https://join.risers.fit/' + (code ? '?c=' + code : ''));
    })();
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0B0C1A; color: #FFFFFF;
    }
    a { color: #AEB2FF; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Only ever seen with scripts switched off. -->
  <noscript>
    <p>You're invited to Risers.
      <a href="https://join.risers.fit/">Continue to your invite</a></p>
  </noscript>
</body>
</html>
